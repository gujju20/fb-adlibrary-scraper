name: Test and build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - run: python -m unittest -v test_export test_web
      - run: docker build -t ad-library-studio .
      - name: Verify container browser installation
        run: >-
          docker run --rm --init ad-library-studio python -c
          "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print(b.version); b.close(); p.stop()"
